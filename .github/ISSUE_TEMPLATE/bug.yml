name: Reproducible bug
description: Report a problem using synthetic inputs
title: "Bug: "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and synthetic reproduction
      description: Include the commit, Node/browser version and minimal input. No private data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Tests, keyboard, viewport or assistive technology checks


